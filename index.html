<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Vice City: After Dark"><meta name="theme-color" content="#090712"><link rel="manifest" href="manifest.webmanifest"><title>Vice City: After Dark</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090712;font-family:Arial,sans-serif;touch-action:none;user-select:none}body{height:100dvh}canvas{display:block;width:100%;height:100%}#tip{position:fixed;bottom:6px;left:50%;transform:translateX(-50%);color:#fff8;font-size:11px;pointer-events:none}button{font:inherit}</style></head><body><canvas id="game"></canvas><div id="tip">WASD / arrows • E enter/interact • F fire • Shift sprint • Space brake</div><script>
const c=document.getElementById('game'),ctx=c.getContext('2d');let W=innerWidth,H=innerHeight,dpr=1;function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
const keys={};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(e.key.toLowerCase()))e.preventDefault()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
const touch={up:0,down:0,left:0,right:0,fire:0,action:0,sprint:0,brake:0};let joy={x:0,y:0,id:null};const acts=new Map();function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function control(x,y){if(x>W*.75&&y>H*.48&&y<H*.7)return'fire';if(x>W*.75&&y>H*.27&&y<H*.48)return'action';if(x>W*.75&&y>H*.7)return'sprint';if(x>W*.5&&x<W*.74&&y>H*.7)return'brake';return null}function clearTouch(){Object.keys(touch).forEach(k=>touch[k]=0);acts.clear();joy.x=joy.y=0;joy.id=null}c.addEventListener('touchstart',e=>{for(const t of e.changedTouches){if(t.clientX<W*.32&&t.clientY>H*.65&&joy.id===null){joy.id=t.identifier;joy.x=clamp((t.clientX-W*.16)/(W*.15),-1,1);joy.y=clamp((t.clientY-H*.82)/(H*.16),-1,1)}else{let n=control(t.clientX,t.clientY);if(n){acts.set(t.identifier,n);touch[n]=1}}}e.preventDefault()},{passive:false});c.addEventListener('touchmove',e=>{for(const t of e.changedTouches){if(t.identifier===joy.id){joy.x=clamp((t.clientX-W*.16)/(W*.15),-1,1);joy.y=clamp((t.clientY-H*.82)/(H*.16),-1,1)}}e.preventDefault()},{passive:false});function tend(e){for(const t of e.changedTouches){if(t.identifier===joy.id){joy.id=null;joy.x=joy.y=0}let n=acts.get(t.identifier);if(n){touch[n]=0;acts.delete(t.identifier)}}e.preventDefault()}c.addEventListener('touchend',tend,{passive:false});c.addEventListener('touchcancel',tend,{passive:false});addEventListener('blur',clearTouch);
const world={w:6000,h:4200},player={x:2850,y:2100,a:0,s:0,inCar:true,carId:0,health:100,armor:25,money:1200,ammo:60,wanted:0,kills:0};
const missions=[{name:'THE MEET',text:'Drive to the Ocean Drive club.',x:4300,y:850,reward:5000},{name:'HOT CARGO',text:'Pick up the package at the auto shop.',x:1800,y:3200,reward:7500},{name:'MARINA GETAWAY',text:'Reach the marina and lose the cops.',x:4700,y:3050,reward:12500}];let stage=0,missionDone=false;
const cars=[],peds=[],police=[],bullets=[],particles=[],pickups=[],buildings=[];const colors=['e94c72','31c8e6','f2a43b','72d45d','c8a3ff','fff'];for(let i=0;i<85;i++){let h=i%2===0;cars.push({id:i,x:300+(i*173)%5300,y:h?430+(i*199)%3300:350+(i*257)%3500,a:h?(i%3?0:Math.PI):(i%3?Math.PI/2:-Math.PI/2),col:i%colors.length,ai:true,s:90+Math.random()*90})}for(let i=0;i<110;i++)peds.push({x:150+(i*311)%5700,y:180+(i*197)%3800,a:Math.random()*6.28,t:Math.random()*10});for(let i=0;i<32;i++)buildings.push({x:300+(i*347)%5200,y:350+(i*181)%3500,w:130+(i%5)*35,h:100+(i%4)*35,name:['HOTEL','CLUB','SHOP','APT','ARCADE'][i%5]});for(let i=0;i<18;i++)pickups.push({x:500+(i*433)%5000,y:500+(i*239)%3300,type:i%3?'cash':'ammo',active:true});
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}function nearestCar(){let best=null,bd=100;for(const o of cars){let d=dist(player,o);if(d<bd){bd=d;best=o}}return best}function w2s(x,y){return[x-player.x+W/2,y-player.y+H/2]}function addParticle(x,y,n=8){for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-.5)*220,vy:(Math.random()-.5)*220,life:.25+Math.random()*.45,r:2+Math.random()*3})}
function interact(){if(player.inCar){let car=nearestCar();if(car){player.inCar=false;player.x=car.x+Math.cos(car.a)*60;player.y=car.y+Math.sin(car.a)*60;player.s=0;car.ai=false}}else{let car=nearestCar();if(car){player.inCar=true;player.carId=car.id;player.x=car.x;player.y=car.y;player.a=car.a}}
 if(stage<missions.length&&dist(player,missions[stage])<170){stage++;player.money+=missions[stage-1].reward;addParticle(player.x,player.y,30);if(stage===missions.length){missionDone=true;player.wanted=0}}}
let lastAct=0,lastShot=0;function shoot(){if(player.ammo<=0)return;player.ammo--;let x=player.x+Math.cos(player.a)*40,y=player.y+Math.sin(player.a)*40;bullets.push({x,y,a:player.a,life:.7});addParticle(x,y,5);player.wanted=Math.min(5,player.wanted+.45)}
function spawnCop(){if(police.length>=Math.min(8,Math.ceil(player.wanted)+1))return;let a=Math.random()*6.28;police.push({x:clamp(player.x+Math.cos(a)*800,80,world.w-80),y:clamp(player.y+Math.sin(a)*800,80,world.h-80),a:0,s:180+Math.random()*60,health:100})}
function update(dt){let up=keys.w||keys.arrowup||touch.up,down=keys.s||keys.arrowdown||touch.down,left=keys.a||keys.arrowleft||touch.left,right=keys.d||keys.arrowright||touch.right;if(joy.id!==null){up=joy.y<-.18;down=joy.y>.18;left=joy.x<-.18;right=joy.x>.18}if((keys.e||touch.action)&&performance.now()-lastAct>300){lastAct=performance.now();interact()}if((keys.f||touch.fire)&&performance.now()-lastShot>170){lastShot=performance.now();shoot()}
 if(!player.inCar){let dx=(right?1:0)-(left?1:0),dy=(down?1:0)-(up?1:0);if(dx||dy){let l=Math.hypot(dx,dy);player.x+=dx/l*230*dt*(keys.shift||touch.sprint?1.45:1);player.y+=dy/l*230*dt*(keys.shift||touch.sprint?1.45:1);player.a=Math.atan2(dy,dx)}}else{if(up)player.s+=430*dt;if(down)player.s-=520*dt;if(!up&&!down)player.s*=Math.pow(.035,dt);player.s=clamp(player.s,-300,620);let steer=(right?1:0)-(left?1:0);player.a+=steer*2.2*dt*(.25+Math.min(1,Math.abs(player.s)/180));if(touch.brake||keys[' '])player.s*=Math.pow(.001,dt);player.x+=Math.cos(player.a)*player.s*dt;player.y+=Math.sin(player.a)*player.s*dt;let car=cars.find(o=>o.id===player.carId);if(car){car.x=player.x;car.y=player.y;car.a=player.a;car.ai=false}}
 player.x=clamp(player.x,60,world.w-60);player.y=clamp(player.y,60,world.h-60);
 for(const o of cars)if(o.ai){o.x+=Math.cos(o.a)*o.s*dt;o.y+=Math.sin(o.a)*o.s*dt;if(o.x<100||o.x>world.w-100)o.a=Math.PI-o.a;if(o.y<100||o.y>world.h-100)o.a=-o.a}
 for(const p of peds){p.t+=dt;if(p.t>3+Math.random()*4){p.a+=(Math.random()-.5)*2;p.t=0}p.x+=Math.cos(p.a)*28*dt;p.y+=Math.sin(p.a)*28*dt;p.x=clamp(p.x,80,world.w-80);p.y=clamp(p.y,80,world.h-80)}
 for(const p of police){let a=Math.atan2(player.y-p.y,player.x-p.x);p.a=a;p.x+=Math.cos(a)*p.s*dt;p.y+=Math.sin(a)*p.s*dt;if(dist(p,player)<100){player.health=Math.max(0,player.health-dt*12);addParticle(player.x,player.y,2)}}if(player.wanted>0){player.wanted=Math.max(0,player.wanted-dt*.018);if(Math.random()<dt*.8)spawnCop()}else police.length=0;
 for(let i=bullets.length-1;i>=0;i--){let b=bullets[i];b.x+=Math.cos(b.a)*1000*dt;b.y+=Math.sin(b.a)*1000*dt;b.life-=dt;let hit=false;for(let j=police.length-1;j>=0;j--)if(dist(b,police[j])<30){police[j].health-=55;hit=true;if(police[j].health<=0){police.splice(j,1);player.kills++;player.money+=500;player.wanted=Math.min(5,player.wanted+.25)}break}if(hit||b.life<=0)bullets.splice(i,1)}
 for(const p of pickups)if(p.active&&dist(player,p)<45){p.active=false;if(p.type==='cash')player.money+=250;else player.ammo+=20;addParticle(p.x,p.y,12)}for(const q of particles){q.x+=q.vx*dt;q.y+=q.vy*dt;q.life-=dt}for(let i=particles.length-1;i>=0;i--)if(particles[i].life<=0)particles.splice(i,1);
 if(player.health<=0){player.health=100;player.x=2850;player.y=2100;player.money=Math.max(0,player.money-1000);player.wanted=0;police.length=0;player.inCar=true}}
function rectRoad(){ctx.fillStyle='#242633';for(let x=0;x<world.w;x+=360){let[sx]=w2s(x,0);ctx.fillRect(sx,0,360,H)}for(let y=0;y<world.h;y+=300){let[,sy]=w2s(0,y);ctx.fillRect(0,sy,W,300)}}function draw(){ctx.fillStyle='#123e39';ctx.fillRect(0,0,W,H);let[wx,wy]=w2s(5000,0);ctx.fillStyle='#07556c';ctx.fillRect(wx,wy,1100,1800);rectRoad();for(let x=0;x<world.w;x+=360){let[sx]=w2s(x,0);ctx.strokeStyle='#d7cb62';ctx.setLineDash([22,28]);ctx.beginPath();ctx.moveTo(sx,0);ctx.lineTo(sx,H);ctx.stroke()}for(let y=0;y<world.h;y+=300){let[,sy]=w2s(0,y);ctx.beginPath();ctx.moveTo(0,sy);ctx.lineTo(W,sy);ctx.stroke()}ctx.setLineDash([]);
 for(const b of buildings){let[sx,sy]=w2s(b.x,b.y);if(sx<-250||sx>W+250||sy<-250||sy>H+250)continue;ctx.fillStyle='#172039';ctx.fillRect(sx,sy-b.h,b.w,b.h);ctx.fillStyle='#ff5ce1';for(let yy=sy-b.h+18;yy<sy-10;yy+=24)ctx.fillRect(sx+12,yy,10,6);ctx.fillStyle='#fff';ctx.font='9px Arial';ctx.fillText(b.name,sx+7,sy+14)}
 for(const p of peds)drawPed(p);for(const o of cars)drawCar(o,o.id===player.carId&&player.inCar);for(const o of police)drawCar(o,true);for(const p of pickups)if(p.active)drawPickup(p);for(const b of bullets){let[sx,sy]=w2s(b.x,b.y);ctx.fillStyle='#ffe76d';ctx.beginPath();ctx.arc(sx,sy,3,0,7);ctx.fill()}for(const q of particles){let[sx,sy]=w2s(q.x,q.y);ctx.globalAlpha=Math.max(0,q.life*2);ctx.fillStyle='#ffb94a';ctx.beginPath();ctx.arc(sx,sy,q.r,0,7);ctx.fill();ctx.globalAlpha=1}drawMission();drawHUD();drawMap()}
function drawPed(p){let[sx,sy]=w2s(p.x,p.y);if(sx<-20||sx>W+20||sy<-20||sy>H+20)return;ctx.fillStyle='#e5b48a';ctx.beginPath();ctx.arc(sx,sy-12,5,0,7);ctx.fill();ctx.fillStyle='#222331';ctx.fillRect(sx-5,sy-7,10,19)}function drawCar(o,pc){let[sx,sy]=w2s(o.x,o.y);if(sx<-90||sx>W+90||sy<-90||sy>H+90)return;ctx.save();ctx.translate(sx,sy);ctx.rotate(o.a);ctx.fillStyle=pc?'#e532e9':'#'+colors[o.col%colors.length];ctx.fillRect(-35,-17,70,34);ctx.fillStyle='#111421';ctx.fillRect(-18,-12,36,10);ctx.fillStyle='#0b0c10';ctx.fillRect(-26,-21,14,6);ctx.fillRect(12,-21,14,6);ctx.fillRect(-26,15,14,6);ctx.fillRect(12,15,14,6);if(police.includes(o)){ctx.fillStyle='#f44';ctx.fillRect(-7,-21,7,4);ctx.fillStyle='#4df';ctx.fillRect(0,-21,7,4)}ctx.restore()}function drawPickup(p){let[sx,sy]=w2s(p.x,p.y);ctx.fillStyle=p.type==='cash'?'#63ff7c':'#ffcc55';ctx.beginPath();ctx.arc(sx,sy,12+Math.sin(performance.now()/130)*3,0,7);ctx.fill();ctx.fillStyle='#111';ctx.font='bold 10px Arial';ctx.textAlign='center';ctx.fillText(p.type==='cash'?'$':'AM',sx,sy+4);ctx.textAlign='left'}function drawMission(){if(stage>=missions.length)return;let m=missions[stage],[sx,sy]=w2s(m.x,m.y),r=28+Math.sin(performance.now()/160)*7;ctx.strokeStyle='#ff4fe3';ctx.lineWidth=4;ctx.beginPath();ctx.arc(sx,sy,r,0,7);ctx.stroke();ctx.fillStyle='#fff';ctx.font='bold 14px Arial';ctx.textAlign='center';ctx.fillText(m.name,sx,sy-44);ctx.textAlign='left'}function drawHUD(){ctx.fillStyle='#111322e8';ctx.fillRect(14,14,390,116);ctx.fillStyle='#ff66e0';ctx.font='bold 18px Arial';ctx.fillText(stage<missions.length?missions[stage].name:'FREE ROAM — CITY COMPLETE',30,40);ctx.fillStyle='#fff';ctx.font='12px Arial';ctx.fillText(stage<missions.length?missions[stage].text:'All story missions complete. Explore, earn cash and survive.',30,63);ctx.fillText(player.inCar?'DRIVING • E to exit':'ON FOOT • E to enter',30,84);ctx.fillStyle='#62ff83';ctx.font='bold 18px Arial';ctx.fillText('$'+player.money.toLocaleString(),30,110);ctx.fillStyle='#fff';ctx.fillText('AMMO '+player.ammo+'   KILLS '+player.kills,155,110);ctx.fillStyle='#252530';ctx.fillRect(30,H-46,220,13);ctx.fillStyle='#ff5368';ctx.fillRect(30,H-46,220*player.health/100,13);ctx.fillStyle='#fff';ctx.font='11px Arial';ctx.fillText('HEALTH '+Math.round(player.health),30,H-52);for(let i=0;i<5;i++){ctx.fillStyle=i<Math.ceil(player.wanted)?'#fff':'#555';ctx.font='20px Arial';ctx.fillText('★',W-145+i*25,38)}if(W<900){ctx.globalAlpha=.55;ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(W*.16,H*.84,62,0,7);ctx.stroke();ctx.beginPath();ctx.arc(W*.16,H*.84,25,0,7);ctx.stroke();for(const q of [[.82,.58,'F'],[.86,.38,'E'],[.82,.82,'RUN'],[.60,.82,'BRAKE']]){ctx.beginPath();ctx.arc(W*q[0],H*q[1],q[2]==='RUN'?30:34,0,7);ctx.stroke();ctx.fillStyle='#fff';ctx.font='bold 11px Arial';ctx.textAlign='center';ctx.fillText(q[2],W*q[0],H*q[1]+4)}ctx.textAlign='left';ctx.globalAlpha=1}}function drawMap(){let s=Math.min(180,W*.24),x=W-s-14,y=14;ctx.fillStyle='#070a12d9';ctx.fillRect(x,y,s,s);ctx.strokeStyle='#53e6ff';ctx.lineWidth=2;ctx.strokeRect(x,y,s,s);let sx=s/world.w,sy=s/world.h;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x+player.x*sx,y+player.y*sy,4,0,7);ctx.fill();if(stage<missions.length){let m=missions[stage];ctx.fillStyle='#ff4fe3';ctx.beginPath();ctx.arc(x+m.x*sx,y+m.y*sy,5,0,7);ctx.fill()}ctx.fillStyle='#f33';for(const p of police)ctx.fillRect(x+p.x*sx-2,y+p.y*sy-2,4,4)}function loop(t){let dt=Math.min(.035,(t-(loop.last||t))/1000);loop.last=t;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
